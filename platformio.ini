; =============================================================================
; OUI-SPY Unified Firmware - Elecrow ThinkNode M5 (ESP32-S3-WROOM-1-N4)
; =============================================================================
; Ported from Seeed Studio XIAO ESP32-S3.
; ThinkNode M5: 4MB flash, NO PSRAM, external 2.4GHz antenna is NOT available
; (the RP-SMA feeds the SX1262 LoRa radio only; WiFi/BLE use the module PCB antenna).

[env:thinknode_m5]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; NOTE: no ARDUINO_USB_CDC_ON_BOOT here. The M5's native-USB pins (GPIO19/20)
    ; are wired to the GPS module, and its serial console is UART0 (GPIO43/44)
    ; through a USB-UART bridge chip. Defaulting Serial to UART0 is correct.
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DBOARD_THINKNODE_M5
    -Isrc/raw

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0

; Flash: 4MB QIO, NO PSRAM (ESP32-S3-WROOM-1-N4)
; bootloader at 0x0, partitions at 0x8000, app at 0x10000
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

build_src_filter = +<*> -<raw/>
