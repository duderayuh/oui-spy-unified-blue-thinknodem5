; =============================================================================
; OUI-SPY Unified Firmware - Elecrow ThinkNode M5 (ESP32-S3R8, 8MB OPI PSRAM)
; =============================================================================
; Ported from Seeed Studio XIAO ESP32-S3.
; ThinkNode M5: ESP32-S3 with 8MB embedded octal PSRAM (confirmed via esptool
; "Embedded PSRAM 8MB"), 4MB+ flash. External 2.4GHz antenna is NOT available
; (the RP-SMA feeds the SX1262 LoRa radio only; WiFi/BLE use the module PCB antenna).

[env:thinknode_m5]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; NOTE: no ARDUINO_USB_CDC_ON_BOOT here. The M5's native-USB pins (GPIO19/20)
    ; are wired to the GPS module, and its serial console is UART0 (GPIO43/44)
    ; through a USB-UART bridge chip. Defaulting Serial to UART0 is correct.
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DBOARD_THINKNODE_M5
    -Isrc/raw

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.1.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.14.0
    https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip

; Flash: QIO, with 8MB octal PSRAM (qio_opi). bootloader at 0x0, partitions at
; 0x8000, app at 0x10000. Flash size kept conservative at 4MB (safe whether the
; module is 4/8/16MB); PSRAM is RAM and needs no extra flash.
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

build_src_filter = +<*> -<raw/>
